# Adds ball boxes from tools/balltest/labels.json to Roboflow. ball-test branch only.
name: Ball labels to Roboflow
on:
  push:
    branches: [ball-test]
    paths: ["tools/balltest/labels.json", "tools/balltest/upload_labels.py"]
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests==2.32.3
      - run: python tools/balltest/upload_labels.py
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
