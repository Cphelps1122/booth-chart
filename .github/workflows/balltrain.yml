# Makes a new full-field-read version and starts training. ball-test branch only.
name: Ball train
on:
  push:
    branches: [ball-test]
    paths: ["tools/balltest/train.py"]
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install roboflow
      - run: python tools/balltest/train.py
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
