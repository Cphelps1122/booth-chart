# track-auto only: tries public field-point models on the Hudl test clips.
name: Field model probe
on:
  push:
    branches: [track-auto]
    paths: [tools/track/field_probe.py, .github/workflows/field-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/track
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/track/requirements.txt
      - run: python tools/track/field_probe.py
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
