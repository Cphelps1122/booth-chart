# Compares player models on the same frames. ball-test branch only.
name: Player model bench
on:
  push:
    branches: [ball-test]
    paths: ["tools/balltest/player_bench.py", "tools/balltest/number_bench.py", "tools/balltest/field_test.py", ".github/workflows/playerbench.yml"]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r tools/track/requirements.txt
      - run: python tools/balltest/field_test.py
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          BENCH_MODELS: football-field-numbers/1,football-field-numbers/2,football-field-numbers/3,football-field-numbers-k4hzg/1,field-numbers/1,field-numbers/2,created-field-numbers/1,football-field-numbers-lvwhb/1,yardage_lines_numbers-instant-1,hash-yards-intersection/4
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: player-bench, path: results/ }
