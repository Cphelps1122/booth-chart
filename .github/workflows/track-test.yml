# Test run for the track-auto branch only. Tracks up to 4 Hudl test clips into a separate game.
name: Tracking test

on:
  push:
    branches: [track-auto]

concurrency:
  group: tracking-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/track
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/track/requirements.txt
      - run: pip install -r tools/track/requirements.txt
      - run: python tools/track/test_run.py
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_RUN: "1"
