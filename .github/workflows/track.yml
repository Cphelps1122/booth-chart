# Play tracking: every few minutes, tracks any new game clips filmed in Solutions. 
# Runs on GitHub's computers. It doesn't touch the charting app or the website files.
# Needs two secrets (Settings > Secrets and variables > Actions):
#   ROBOFLOW_API_KEY          your Roboflow private API key
#   FIREBASE_SERVICE_ACCOUNT  the whole .json key file from Firebase > Project settings > Service accounts
name: Play tracking

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:                       # pushing tracking changes starts a watch right away
    branches: [main]
    paths:
      - ".github/workflows/track.yml"
      - "tools/track/**"

concurrency:
  group: play-tracking
  cancel-in-progress: false

permissions:
  contents: read
  actions: write              # lets a watch start the next watch before it ends

env:
  # Each run watches for new clips every minute for up to 5.5 hours, then starts the next run,
  # until this time (UTC). 08:00 UTC = 2 am Central.
  TRACK_UNTIL: "2026-11-14T08:00:00Z"

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/track
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/track/requirements.txt
      - run: pip install -r tools/track/requirements.txt
      - run: python tools/track/run.py
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TRACK_LOOP_MINUTES: "330"
      - name: Start the next watch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s); stop=$(date -u -d "$TRACK_UNTIL" +%s)
          if [ $((stop - now)) -gt 300 ]; then
            gh workflow run track.yml --ref main -R "$GITHUB_REPOSITORY" && echo "Next watch started."
          else
            echo "Done watching for tonight."
          fi
