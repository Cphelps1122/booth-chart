// light / dark switch shared by every page; first visit follows the device, then remembers the choice
(function () {
  var K = "solutions-theme", root = document.documentElement, get = function () { try { return localStorage.getItem(K) } catch (e) { return null } };

  var cur = function () { return get() || dev() };
  function apply() { var t = cur(); root.setAttribute("data-theme", t); root.style.colorScheme = t; var b = document.getElementById("solTheme"); if (b) { b.textContent = t === "dark" ? "☀︎ Light" : "☾ Dark"; b.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode") } }
  apply();
  window.solThemeNow = cur;
  // paper is always light
  window.addEventListener("beforeprint", function () { root.setAttribute("data-theme", "light"); root.style.colorScheme = "light" });
  window.addEventListener("afterprint", apply);
  function mount() {

    var b = document.createElement("button"); b.id = "solTheme"; b.type = "button";
    b.addEventListener("click", function () { var n = cur() === "dark" ? "light" : "dark"; try { localStorage.setItem(K, n) } catch (e) {} apply(); try { window.dispatchEvent(new Event("solthemechange")) } catch (e) {} });
    var slot = document.getElementById("solThemeSlot"), h = document.querySelector("header");
    if (slot) { slot.appendChild(b); b.classList.add("inline") } else { (h || document.body).appendChild(b); if (!h) b.classList.add("float") }
    apply();
  }

<style>
/* Impact: postgame scout grades and how the app performed. */
:root {

* { box-sizing: border-box } [hidden] { display: none !important }

<script>

    return "Scout " + nm(x.said) + (x.saidPct != null ? " " + Math.round(x.saidPct * 100) + "%" : "") + " · tonight " + nm(x.top) + " " + Math.round(x.topPct * 100) + "% (" + x.n + ")";
  }
  function inSeason() { return GAMES.filter(function (g) { return g.season === SEASON }) }
  function res(g) { return g.us > g.them ? "w" : g.us < g.them ? "l" : "" }
  function render() {
    var G = inSeason();
    if (SEL && !G.some(function (g) { return g.code === SEL })) SEL = null;
    $("gameSeg").innerHTML = "<button type='button' data-g='' aria-pressed='" + !SEL + "'>Season impact<small>" + G.length + " games</small></button>" + G.map(function (g) {
      return "<button type='button' data-g='" + esc(g.code) + "' aria-pressed='" + (SEL === g.code) + "'>" + esc(g.opp) + "<small>" + nice(g.date) + " · " + (res(g) ? res(g).toUpperCase() + " " : "") + g.us + "–" + g.them + (g.gr.score != null ? " · scout " + g.gr.score + "%" : "") + "</small></button>" }).join("");
    $("gameSeg").querySelectorAll("button").forEach(function (b) { b.addEventListener("click", function () { SEL = b.dataset.g || null; try { history.replaceState(null, "", SEL ? "?game=" + encodeURIComponent(SEL) : location.pathname) } catch (e) {} render(); window.scrollTo(0, 0) }) });
    if (!G.length) { $("out").innerHTML = "<div class='panel empty'>No charted games yet. Chart a game and tap End game to grade it.</div>"; return }
    $("out").innerHTML = SEL ? gameHTML(G.filter(function (g) { return g.code === SEL })[0]) : seasonHTML(G);
  }
  function ncLine(n) {
    if (!n.tracked) return null;
    return { fe: pc(n.f.ef, n.f.n), oe: pc(n.o.ef, n.o.n), fy: n.f.n ? n.f.yd / n.f.n : null, oy: n.o.n ? n.o.yd / n.o.n : null };
  }
  function gameHTML(g) {
    var gr = g.gr, d = g.dec, n = g.nc, q = g.q, h = "";
    var predTxt = g.pred ? "Pregame projection " + g.pred.us + "–" + g.pred.them + " (" + (g.pred.us > g.pred.them ? "us" : g.pred.us < g.pred.them ? "them" : "even") + ")" : "No pregame projection saved";
    h += "<div class='hero'><div><div class='lab'>Scout grade</div><div class='big'>" + (gr.score == null ? "–" : gr.score + "%") + "</div></div><div class='txt'><b>" + esc(SCHOOL) + " " + g.us + ", " + esc(g.opp) + " " + g.them + "</b> · " + nice(g.date) + (g.final ? " · Final" : " · not marked final") + "<br>" +
      (gr.items.length ? gr.held + " held, " + gr.close + " close, " + gr.miss + " missed of " + gr.items.length + " graded scout items." : g.scout ? "Not enough tagged snaps to grade the scout (5+ per situation)." : "No scout was loaded for this game, so there's nothing to grade it against.") + "<br><span style='color:#b9bbc0'>" + esc(predTxt) + "</span></div></div>";
    // KPIs
    var nl = ncLine(n), fourOk = d.fourth.filter(function (x) { return x.ok }).length, twoOk = d.two.filter(function (x) { return x.ok }).length;
    h += "<div class='kpis'>" +
      k(gr.lookAcc == null ? "–" : gr.lookAcc + "%", "Look called right", gr.nLooks ? "shell / coverage / front, " + gr.nLooks + " graded" : "needs tagged looks") +
      k(gr.blitzAcc == null ? "–" : gr.blitzAcc + "%", "Blitz rate within 10", gr.nBlitz ? gr.nBlitz + " situations" : "needs pressure tags") +
      k(nl ? (nl.fe == null ? "–" : nl.fe + "%") : "–", "Next Call plays efficient", nl ? "vs " + (nl.oe == null ? "–" : nl.oe + "%") + " other calls (" + n.f.n + " / " + n.o.n + ")" : "not tracked this game") +
      k(d.fourth.length ? fourOk + "/" + d.fourth.length : "–", "4th downs per chart", d.fourth.length ? "went " + d.fourth.filter(function (x) { return x.did === "GO" }).length + ", converted " + d.fourth.filter(function (x) { return x.conv }).length : "none") +
      k(d.two.length ? twoOk + "/" + d.two.length : "–", "Tries per chart", d.two.length ? "PAT/2-pt choices" : "no tries") +
      k(pcs(q.look, q.n), "Snaps with their look", q.n + " plays charted") + "</div>";
    // situations
    var rowHTML = function (r) { return r.items.map(function (x, i) { return "<tr>" + (i === 0 ? "<td rowspan='" + r.items.length + "'>" + esc(r.k) + "<br><span class='note'>" + r.n + " snaps tonight · scout " + r.sn + "</span></td>" : "") + "<td class='it'>" + x.lab + "</td><td>" + esc(fmtItem(x)) + "</td><td>" + chip(x.g) + "</td></tr>" }).join("") };
    var sr = gr.rows.filter(function (r) { return r.items.length && r.k !== "ALL" }), all = gr.rows.filter(function (r) { return r.k === "ALL" })[0];
    h += "<section class='panel'><h2>Scout vs tonight · by situation <small>Held = same top look / within 10 pts · Close = their #2 look / within 20 · 5+ snaps to grade</small></h2>" +
      (sr.length || (all && all.items.length) ? "<div class='tbl'><table><tr><th>Situation</th><th>Item</th><th>Scout said · tonight</th><th>Grade</th></tr>" + (all && all.items.length ? rowHTML({ k: "Overall", n: all.n, sn: all.sn, items: all.items }) : "") + sr.map(rowHTML).join("") + "</table></div>" : "<p class='empty'>" + (g.scout ? "Not enough tagged snaps per situation yet." : "No scout for this game.") + "</p>") + "</section>";
    if (gr.frows.length) h += "<section class='panel'><h2>Scout vs tonight · by our formation</h2><div class='tbl'><table><tr><th>Formation</th><th>Item</th><th>Scout said · tonight</th><th>Grade</th></tr>" + gr.frows.map(rowHTML).join("") + "</table></div></section>";
    if (gr.crows.length) h += "<section class='panel'><h2>What the scout said about plays</h2><div class='tbl'><table><tr><th>Concept</th><th>Scout said</th><th>Tonight</th><th>Grade</th></tr>" + gr.crows.map(function (r) { return "<tr><td>" + esc(r.k) + "</td><td>" + esc(r.said) + "</td><td>" + (r.n ? r.n + " plays, " + r.ypp.toFixed(1) + " a play" : "not run") + "</td><td>" + chip(r.n >= 3 ? r.g : "na") + "</td></tr>" }).join("") + "</table></div><p class='note'>Matched by name to our calls. Needs 3+ plays to grade.</p></section>";
    // what changed
    var miss = []; gr.rows.concat(gr.frows).forEach(function (r) { if (r.k === "ALL") return; r.items.forEach(function (x) { if (x.g === "miss") miss.push(r.k + " · " + x.lab + ": " + fmtItem(x)) }) });
    gr.crows.forEach(function (r) { if (r.g === "miss" && r.n >= 3) miss.push(r.k + ": scout said “" + r.said + "”, tonight " + r.n + " plays at " + r.ypp.toFixed(1) + " a play") });
    h += "<div class='grid2'><section class='panel'><h2>What changed from the scout</h2>" + (miss.length ? "<ul class='bul'>" + miss.slice(0, 10).map(function (t) { return "<li>" + esc(t) + "</li>" }).join("") + "</ul>" : "<p class='note'>Nothing graded as a miss.</p>") + "</section>";
    h += "<section class='panel'><h2>Next Call</h2>" + (nl ? "<div class='tbl'><table><tr><th></th><th>Plays</th><th>Efficient</th><th>Yds/play</th><th>Explosive</th></tr><tr><td>Ran a top-3 Next Call</td><td>" + n.f.n + "</td><td>" + pcs(n.f.ef, n.f.n) + "</td><td>" + avg(n.f.yd, n.f.n) + "</td><td>" + pcs(n.f.ex, n.f.n) + "</td></tr><tr><td>Other calls</td><td>" + n.o.n + "</td><td>" + pcs(n.o.ef, n.o.n) + "</td><td>" + avg(n.o.yd, n.o.n) + "</td><td>" + pcs(n.o.ex, n.o.n) + "</td></tr></table></div><p class='note'>Followed Next Call on " + pcs(n.f.n, n.f.n + n.o.n) + " of called plays.</p>" : "<p class='note'>Next Call wasn't tracked for this game.</p>") + "</section></div>";
    // decisions
    h += "<div class='grid2'><section class='panel'><h2>4th downs <small>chart rule vs what we did</small></h2>" + (d.fourth.length ? "<div class='tbl'><table><tr><th>Q</th><th>Situation</th><th>Chart</th><th>We</th><th>Result</th></tr>" + d.fourth.map(function (x) { return "<tr><td>" + x.q + "</td><td>" + x.dd + " · " + x.at + "</td><td>" + x.chart + "</td><td>" + x.did + "</td><td>" + x.res + (x.ok ? "" : " <span class='g close'>off chart</span>") + "</td></tr>" }).join("") + "</table></div><p class='note'>Kicks are read from drives that ended on a stopped 3rd down, so end-of-half drives show up too.</p>" : "<p class='note'>No 4th downs.</p>") + "</section>";
    h += "<section class='panel'><h2>Tries after TDs <small>go-for-2 chart vs what we did</small></h2>" + (d.two.length ? "<div class='tbl'><table><tr><th>Q</th><th>Score before try</th><th>Chart</th><th>We</th><th>Result</th></tr>" + d.two.map(function (x) { return "<tr><td>" + (x.q >= 5 ? "OT" : x.q) + "</td><td>" + (x.margin > 0 ? "+" : "") + x.margin + "</td><td>" + (x.chart === "either" ? "either" : x.chart === "2" ? "Go for 2" : "Kick") + "</td><td>" + (x.did === "2" ? "Went for 2" : "Kicked") + "</td><td>" + (x.good ? "Good" : "No good") + (x.ok ? "" : " <span class='g close'>off chart</span>") + "</td></tr>" }).join("") + "</table></div><p class='note'>Clock is estimated from the quarter.</p>" : "<p class='note'>No tries.</p>") + "</section></div>";
    // charting quality
    h += "<section class='panel'><h2>Charting quality <small>how complete the data is · better tags = sharper grades</small></h2><div class='kpis'>" + k(q.n, "Plays charted", "") + k(pcs(q.look, q.n), "Their look tagged", "") + k(pcs(q.form, q.n), "Formation tagged", "") + k(pcs(q.call, q.n), "Call tagged", "") + k(pcs(q.pl, q.npl), "Ball carrier / target", "") + "</div></section>";
    return h;
  }
  function k(v, lab, sub) { return "<div class='kpi'><b>" + v + "</b><span>" + lab + "</span>" + (sub ? "<i>" + sub + "</i>" : "") + "</div>" }
  function seasonHTML(G) {
    var I = [], L = [], B = [], F = { n: 0, ef: 0, ex: 0, yd: 0 }, O = { n: 0, ef: 0, ex: 0, yd: 0 }, ncG = 0, four = [], two = [], pr = [], Q = { n: 0, look: 0, pl: 0, npl: 0 };
    G.forEach(function (g) {
      I = I.concat(g.gr.items); L = L.concat(g.gr.items.filter(function (x) { return x.lab === "Shell" || x.lab === "Coverage" || x.lab === "Front" })); B = B.concat(g.gr.items.filter(function (x) { return x.lab === "Blitz rate" }));
      if (g.nc.tracked) { ncG++; ["n", "ef", "ex", "yd"].forEach(function (x) { F[x] += g.nc.f[x]; O[x] += g.nc.o[x] }) }
      four = four.concat(g.dec.fourth); two = two.concat(g.dec.two);
      if (g.pred && (g.final || g.us || g.them)) pr.push({ g: g, pm: g.pred.us - g.pred.them, am: g.us - g.them });
      Q.n += g.q.n; Q.look += g.q.look; Q.pl += g.q.pl; Q.npl += g.q.npl;
    });
    var held = I.filter(function (x) { return x.g === "held" }).length, close = I.filter(function (x) { return x.g === "close" }).length;
    var sAcc = I.length ? Math.round(100 * (held + .5 * close) / I.length) : null, lAcc = L.length ? pc(L.filter(function (x) { return x.g === "held" }).length, L.length) : null, bAcc = B.length ? pc(B.filter(function (x) { return x.g === "held" }).length, B.length) : null;
    var right = pr.filter(function (x) { return (x.pm > 0 && x.am > 0) || (x.pm < 0 && x.am < 0) || (x.pm === 0 && x.am === 0) }).length, mErr = pr.length ? pr.reduce(function (t, x) { return t + Math.abs(x.pm - x.am) }, 0) / pr.length : null;
    var fourGo = four.filter(function (x) { return x.did === "GO" }), fourOk = four.filter(function (x) { return x.ok }).length;
    var h = "<div class='hero'><div><div class='lab'>Scout accuracy · " + esc(SEASON || "") + "</div><div class='big'>" + (sAcc == null ? "–" : sAcc + "%") + "</div></div><div class='txt'>Across <b>" + G.length + " charted game" + (G.length === 1 ? "" : "s") + "</b> and <b>" + I.length + " graded scout items</b>, the pregame scout held up " + (sAcc == null ? "–" : sAcc + "%") + " of the time (" + held + " held, " + close + " close). " +
      (F.n && O.n ? "Plays called from Next Call were <b>" + pcs(F.ef, F.n) + " efficient</b> vs " + pcs(O.ef, O.n) + " for other calls. " : "") +
      (pr.length ? "The pregame projection picked the winner in <b>" + right + " of " + pr.length + "</b>." : "") + "</div></div>";
    h += "<div class='kpis'>" +
      k(lAcc == null ? "–" : lAcc + "%", "Their look called right", L.length + " shell / coverage / front predictions") +
      k(bAcc == null ? "–" : bAcc + "%", "Blitz rate within 10 pts", B.length + " situations") +
      k(F.n ? pcs(F.ef, F.n) : "–", "Next Call plays efficient", F.n ? F.n + " plays · other calls " + pcs(O.ef, O.n) + " (" + O.n + ")" : "not tracked yet") +
      k(F.n ? avg(F.yd, F.n) : "–", "Next Call yds a play", O.n ? "other calls " + avg(O.yd, O.n) : "") +
      k(F.n ? pcs(F.ex, F.n) : "–", "Next Call explosive rate", O.n ? "other calls " + pcs(O.ex, O.n) : "") +
      k(four.length ? fourOk + "/" + four.length : "–", "4th-down calls per chart", fourGo.length ? "went for it " + fourGo.length + ", converted " + fourGo.filter(function (x) { return x.conv }).length : "") +
      k(two.length ? two.filter(function (x) { return x.ok }).length + "/" + two.length : "–", "Tries per go-for-2 chart", "") +
      k(pr.length ? right + "/" + pr.length : "–", "Projection picked winner", mErr != null ? "off by " + mErr.toFixed(1) + " pts a game" : "needs Matchup Predictor") +
      k(pcs(Q.look, Q.n), "Snaps with their look tagged", Q.n + " plays charted") + "</div>";
    h += "<section class='panel'><h2>Game by game <small>tap a game above for its full postgame report</small></h2><div class='tbl'><table><tr><th>Game</th><th>Result</th><th>Projection</th><th>Scout grade</th><th>Look right</th><th>Blitz within 10</th><th>Next Call eff</th><th>Other calls eff</th><th>4th downs per chart</th><th>Look tagged</th></tr>" +
      G.map(function (g) { var nl = g.nc; return "<tr><td>" + esc(nice(g.date) + " " + g.opp) + "</td><td><span class='wl " + res(g) + "'>" + (res(g) ? res(g).toUpperCase() + " " : "") + g.us + "–" + g.them + "</span></td><td>" + (g.pred ? g.pred.us + "–" + g.pred.them : "–") + "</td><td>" + (g.gr.score == null ? (g.scout ? "too few tags" : "no scout") : g.gr.score + "% (" + g.gr.items.length + ")") + "</td><td>" + (g.gr.lookAcc == null ? "–" : g.gr.lookAcc + "%") + "</td><td>" + (g.gr.blitzAcc == null ? "–" : g.gr.blitzAcc + "%") + "</td><td>" + (nl.tracked ? pcs(nl.f.ef, nl.f.n) + " (" + nl.f.n + ")" : "–") + "</td><td>" + (nl.tracked ? pcs(nl.o.ef, nl.o.n) + " (" + nl.o.n + ")" : "–") + "</td><td>" + (g.dec.fourth.length ? g.dec.fourth.filter(function (x) { return x.ok }).length + "/" + g.dec.fourth.length : "–") + "</td><td>" + pcs(g.q.look, g.q.n) + "</td></tr>" }).join("") + "</table></div></section>";
    // pitch lines
    var lines = [];
    if (sAcc != null) lines.push("The pregame scout held up " + sAcc + "% of the time across " + I.length + " graded items in " + (function (n) { return n + " game" + (n === 1 ? "" : "s") })(G.filter(function (g) { return g.gr.items.length }).length) + ".");
    if (lAcc != null) lines.push("Coaches knew the defense's most likely look before the snap " + lAcc + "% of the time (" + L.length + " predictions).");
    if (F.n >= 10 && O.n >= 10) lines.push("Plays called from Next Call were " + pcs(F.ef, F.n) + " efficient and gained " + avg(F.yd, F.n) + " a play, vs " + pcs(O.ef, O.n) + " and " + avg(O.yd, O.n) + " for other calls (" + F.n + " vs " + O.n + " plays).");
    if (pr.length) lines.push("The pregame projection picked the winner in " + right + " of " + pr.length + " games.");
    if (Q.n) lines.push(Q.n + " plays charted live this season, with every coach seeing the same data in real time.");
    h += "<div class='grid2'><section class='panel'><h2>Pitch lines <small>numbers you can say out loud</small></h2>" + (lines.length ? "<ul class='bul'>" + lines.map(function (t) { return "<li>" + esc(t) + "</li>" }).join("") + "</ul>" : "<p class='note'>Chart and grade a few games to build these.</p>") + "</section>";
    h += "<section class='panel'><h2>Read these honestly</h2><div class='honest'>These numbers show how accurate the scout and models were and how the app's recommendations performed. They don't prove the app caused a win, because there are no games charted without it to compare against. Small samples swing a lot, so play counts are shown everywhere. Better tagging (their look, the ball carrier or target) makes every grade sharper.</div></section></div>";
    return h;
  }
  $("seasonSel").addEventListener("change", function () { SEASON = this.value; SEL = null; render() });
  $("printBtn").addEventListener("click", function () { window.print() });
  load();
})();
</script>
</body></html>
