<title>Mock Game</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* layout: same order as the live chart — scoreboard, spot strip, the call sheet on screen, drives drawn on the field, play by play */

.gswrap { overflow: auto; border: 1px solid #222; max-height: 62vh; -webkit-overflow-scrolling: touch }
.gsgrid { display: grid; background: #fff; color: #000; font: 700 12px Arial, Helvetica, sans-serif; width: max-content; min-width: 100% }
.gsgrid > div { background: #fff; min-height: 24px; box-shadow: 0 0 0 .5px #9aa3ad; display: flex; align-items: center; padding: 1px 3px; overflow: hidden } .gsgrid .gh { justify-content: center; text-align: center; font-weight: 900 } .gsgrid .sit-on { outline: 3px solid #ffd400; outline-offset: -3px } .gsgrid .gc.sit-on { background: #fff9d6 } .gsgrid .gc { gap: 2px; flex-wrap: wrap }
.gsgrid .gc button { font: inherit; border: 1px solid transparent; background: none; padding: 5px; border-radius: 5px; cursor: pointer; flex: 1 1 auto; text-align: left; white-space: nowrap; line-height: 1.15 } .gsgrid .gc button:hover:enabled { border-color: #9aa3ad } .gsgrid .gc button:disabled { cursor: default } .gsgrid .gc button[aria-pressed=true] { background: #111; color: #fff } .gsgrid .k-run { color: #d00000 } .gsgrid .k-pass { color: #0030d0 } .gsgrid .k-scr { color: #000 } .gsgrid .d { font-size: .8em; opacity: .7; margin-right: 3px } .gsgrid .n { font-size: .78em; background: #ffd400; color: #000; border-radius: 4px; padding: 0 3px; margin-left: 3px }
.bar { display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; margin: 4px 0; font-size: 14px } .bar .t { background: #1b2632; border-radius: 3px; overflow: hidden; height: 10px } .bar i { display: block; height: 10px; background: var(--them) } .bar i.r { background: var(--bad) } .bar em { font-style: normal; text-align: right; color: var(--muted) }
.sub { font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px } .note { color: var(--muted); font-size: 13px; margin: 8px 0 0 }
.fourth { background: #2a1f08; border: 1px solid var(--gold); border-radius: 8px; padding: 10px } .fourth p { margin: 0 0 8px } .their { background: #10203a; border: 1px solid var(--them); border-radius: 8px; padding: 10px 12px }
.drill { background: #10203a; border: 1px solid var(--gold); border-radius: 8px; padding: 10px 12px } .drill small { display: block; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase } .drill b { font: 800 24px/1.15 var(--f-display); text-transform: uppercase } .drill p { margin: 2px 0 0; color: var(--muted) }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--night); padding: 8px 14px; border-radius: 8px; font-weight: 600; z-index: 30; max-width: 90vw }
</style>

<div class="wrap">
  <div class="top">
    <div><h1>Mock <span>Game</span></h1><nav class="sitenav" data-solnav="mock"></nav></div>
    <div class="row"><span class="note" id="modeTag" style="margin:0"></span><button class="btn" id="setupBtn" type="button">Setup</button><button class="btn" id="endBtn" type="button">End &amp; report</button></div>
  </div>

  <section class="panel" id="setup">
    <h2>Run a game your way <small>Practice calling a game, or practice charting one</small></h2>
    <label class="drop big" id="dSheet" for="fSheet"><b>Upload your call sheet</b><span id="nSheet">Your sheet, laid out like it is on game day. Google Sheets: File, Download, Microsoft Excel (.xlsx).</span><input type="file" id="fSheet" accept=".xlsx" hidden></label>
    <div class="grid3" style="margin-top:10px">
      <label class="mode"><input type="radio" name="mode" value="call" checked><span><b>Call the game</b><span class="note">Tap a play, snap it, and the result comes back on its own.</span></span></label>
      <label class="mode"><input type="radio" name="mode" value="chart"><span><b>Charting practice</b><span class="note">Hear the call, then chart the play, result and spot. You're graded on it.</span></span></label>
    </div>
    <div class="row" style="margin-top:10px;align-items:flex-end"><label class="f">Your team<input type="text" id="usName" value="Our team"></label><label class="f">Opponent<input type="text" id="oppName" value="Opponent"></label><label class="f">Game length<select id="len"><option value="4">Full game</option><option value="2">One half</option></select></label><button class="btn pri" id="startBtn" type="button">Start</button><button class="btn" id="sampleBtn" type="button">Try a sample game</button></div>
    <details><summary>Make results more real with Hudl film (optional)</summary>
      <div class="grid3"><label class="drop" id="dOurs" for="fOurs"><b>Our offense</b><span id="nOurs"></span><input type="file" id="fOurs" accept=".xlsx,.csv" multiple hidden></label><label class="drop" id="dThem" for="fThem"><b>Their games</b><span id="nThem"></span><input type="file" id="fThem" accept=".xlsx,.csv" multiple hidden></label></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="clrFilm" type="button">Clear film</button><span class="note" id="saveNote" style="margin:0"></span></div>
    </details>
  </section>

  <div id="game" hidden>
    <div class="board" aria-live="polite">
      <div class="cell us"><small id="lUs"></small><b id="sUs">0</b></div><div class="cell them"><small id="lThem"></small><b id="sThem">0</b></div>
      <div class="cell"><small id="sQ">Q1</small><b id="sClock">12:00</b></div><div class="cell dd"><small>Down</small><b id="sDD">1st &amp; 10</b></div><div class="cell"><small>Ball</small><b id="sBall"></b></div>
    </div>
    <div class="field"><svg id="strip" viewBox="0 0 1000 150" role="img" aria-label="Field showing the ball, line of scrimmage and line to gain"></svg><div class="result" id="res" hidden></div></div>
    <div id="act"></div>
    <section class="panel"><h2>Call sheet <small id="sheetSit"></small></h2><div class="gswrap"><div class="gsgrid" id="grid"></div></div></section>
    <section class="panel" id="readPanel" hidden><h2>Pre-snap read <span id="readSub"></span></h2><div id="read"></div></section>
    <section class="panel"><h2>Drives</h2><div class="field"><svg id="drives" viewBox="0 0 1000 120" role="img" aria-label="Drives drawn on the field"></svg></div></section>
    <section class="panel"><h2>Play by play</h2><ul class="log" id="log"></ul></section>
  </div>
  <section class="panel" id="report" hidden></section>
</div>
<div class="snapbar" id="snapbar" hidden><span id="snapName"></span><button class="btn" id="unsel" type="button">Change</button><button class="btn pri" id="snapBtn" type="button">Snap</button></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="scoutkit.js"></script>
<script src="nav.js"></script>

      "<div class='kpis'>" + kpi(n, "plays") + kpi(n ? (yds / n).toFixed(1) : "–", "yards per play") + kpi(n ? Math.round(100 * ok / n) + "%" : "–", "successful plays") + kpi(n ? Math.round(100 * runs / n) + "/" + (100 - Math.round(100 * runs / n)) : "–", "run / pass %") + kpi(S.filter(function (s) { return s.tempo }).length, "run it again snaps") + "</div>" +
      "<div class='sub'>Drives</div><div class='tbl'><table><tr><th>#</th><th>Start</th><th>Plays</th><th>Yds</th><th>Result</th></tr>" + G.drives.map(function (d, i) { return "<tr><td>" + (i + 1) + "</td><td>" + spot(d.start) + "</td><td>" + d.plays + "</td><td>" + d.yds + "</td><td>" + esc(d.res) + "</td></tr>" }).join("") + "</table></div>" + tab("By down & distance", group(function (s) { return s.b }), "Situation") + tab("By call", group(function (s) { return s.call }), "Call") +
      "<p class='note'>" + film + " of " + n + " results came from your film. The rest are estimates from typical high school averages, not your team. " + esc(D.opp) + " never adjusts.</p><div class='row' style='margin-top:10px'><button class='btn pri' type='button' id='again'>Play again</button></div>";
    var r = $("report"); r.innerHTML = h; r.hidden = false; r.scrollIntoView({ behavior: "smooth" }); $("again").onclick = function () { newGame(); window.scrollTo({ top: 0, behavior: "smooth" }) } }

  function loadData() { D.ours = RAW.ours.length ? SK.load(RAW.ours, {}) : null; D.them = RAW.them.length ? SK.load(RAW.them, {}) : null; build();
    $("nOurs").textContent = D.ours ? RAW.ours.length + " file(s) · " + D.calls.length + " calls with 4+ plays" : "Optional. Lets results come from your own plays.";
    $("nThem").textContent = D.them ? RAW.them.length + " file(s) · " + D.def.length + " defensive snaps" : "Optional. Adds the pre-snap read and their real drive results.";
    $("dOurs").classList.toggle("ok", !!D.ours); $("dThem").classList.toggle("ok", !!D.them) }
  function addFiles(kind, files) { Promise.all(Array.prototype.map.call(files, parseFile)).then(function (L) { RAW[kind] = RAW[kind].concat(L); loadData(); saveFiles(); toast("Loaded") }, function () { toast("Couldn't read that file. Export it from Hudl as Excel (.xlsx) or CSV.") }) }
  $("fOurs").onchange = function () { if (this.files.length) addFiles("ours", this.files); this.value = "" };
  $("fThem").onchange = function () { if (this.files.length) addFiles("them", this.files); this.value = "" };
  $("clrFilm").onclick = function () { RAW.ours = []; RAW.them = []; loadData(); saveFiles() };
  $("setupBtn").onclick = function () { var s = $("setup"); s.hidden = !s.hidden; if (!s.hidden) window.scrollTo({ top: 0, behavior: "smooth" }) };
  $("endBtn").onclick = function () { if (!G || !G.snaps.length) { toast("Run a few plays first."); return } G.over = true; if (G.drive) endDrive("Stopped"); P = {}; refresh(); finishGame() };
  // ======================= START =======================
  var nm = store.get("sol-mock-names"); if (nm) { $("usName").value = nm.us; $("oppName").value = nm.opp }
  useSheet(store.get("sol-mock-sheet")); D.calls = []; D.def = []; D.theirRates = { td: .3, to: .1, fg: .06, plays: 6, n: 0, real: false };
  var local = store.get("sol-mock-files"); usePack(local); loadData();
  cloud("files").then(function (p) { if (p && p.at && (!local || p.at > (local.at || 0)) && usePack(p)) { store.set("sol-mock-files", p); loadData() } }, function () {});
  cloud("sheet").then(function (t) { if (typeof t === "string") { try { var s = JSON.parse(t); if (useSheet(s)) store.set("sol-mock-sheet", s) } catch (e) {} } }, function () {});

})();
