<meta charset="utf-8">
<title>Mock Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* layout: press-box view — scoreboard strip, end-zone-camera field, the read and the call sheet beside it, drive log and report below */
:root {
  --night: #0b1016; --panel: #131b24; --panel2: #0f161e; --line: #24313f; --ink: #e9eef3; --muted: #8fa0b2;
  --us: #d4213d; --them: #2e5aa8; --gold: #f2c14e; --good: #3fbf6f; --bad: #ef5a5a;
  --f-display: "Saira Condensed", "Arial Narrow", sans-serif; --f-body: "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--night); color: var(--ink); font: 15px/1.45 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px }
.wrap { max-width: 1060px; margin: 0 auto; display: grid; gap: 12px }
h1 { margin: 0; font: 800 24px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase }
h1 span { color: var(--us) }
h2 { margin: 0 0 8px; font: 800 18px/1.1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; text-wrap: balance }
h2 span { color: var(--muted); font: 500 13px var(--f-body); letter-spacing: 0; text-transform: none }
.top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }
.board { display: flex; flex-wrap: wrap; gap: 8px }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; display: grid; align-content: center; min-width: 70px }
.cell small { font: 600 11px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.cell b { font: 800 26px/1.05 var(--f-display); letter-spacing: .02em; font-variant-numeric: tabular-nums }
.cell.us b { color: var(--us) } .cell.them b { color: #7ea6ef } .cell.dd { background: var(--us); border-color: var(--us) } .cell.dd small { color: #ffd9de }
.fieldbox { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #08111a }
canvas { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none }
.tag { position: absolute; left: 10px; top: 8px; font: 600 12.5px/1.3 var(--f-body); background: rgba(11,16,22,.8); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; max-width: calc(100% - 20px) }
.tag b { color: var(--gold) }
.result { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font: 800 clamp(17px, 4.2vw, 32px)/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; background: rgba(11,16,22,.85); border-radius: 8px; padding: 8px 16px; white-space: nowrap }
.result.good { color: var(--good) } .result.bad { color: var(--bad) } .result.td { color: var(--gold) }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 12px; align-items: start }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0 }
.bar { display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; margin: 4px 0; font-size: 14px }
.bar .t { background: #1b2632; border-radius: 3px; overflow: hidden; height: 10px } .bar i { display: block; height: 10px; background: var(--them) } .bar i.r { background: var(--bad) }
.bar em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted) }
.sub { font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px }
.note { color: var(--muted); font-size: 13px; margin: 8px 0 0 }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px }
.chip, .btn { font: 700 14px var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); cursor: pointer }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--night) }
.btn.pri { background: var(--us); border-color: var(--us) } .btn.gold { background: var(--gold); border-color: var(--gold); color: #1a1406 }
.btn:disabled { opacity: .45; cursor: default }
.chip:focus-visible, .btn:focus-visible, .call:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.calls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; max-height: 520px; overflow-y: auto; padding-right: 2px }
@media (max-width: 440px) { .calls { grid-template-columns: 1fr } }
.call { text-align: left; font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 1px }
.call:hover:not(:disabled) { border-color: var(--us) } .call:disabled { opacity: .45; cursor: default }
.call b { font: 800 17px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase }
.call span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums }
.call .k { font: 700 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--gold) }
.call .k.thin { color: var(--muted) }
.call.pick { border-color: var(--gold) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.fourth { background: #2a1f08; border: 1px solid var(--gold); border-radius: 8px; padding: 10px; margin-bottom: 10px }
.fourth p { margin: 0 0 8px }
.their { background: #10203a; border: 1px solid var(--them); border-radius: 8px; padding: 10px 12px }
.log { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; font-variant-numeric: tabular-nums; max-height: 320px; overflow-y: auto }
.log li { display: grid; grid-template-columns: 120px minmax(0, 1fr) 54px; gap: 8px; border-top: 1px solid var(--line); padding-top: 3px }
.log li.dv { grid-template-columns: 1fr; color: var(--muted); font-weight: 600 }
.log .g { color: var(--good) } .log .r { color: var(--bad) } .log .y { color: var(--gold) }
.tbl { overflow-x: auto } table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums } th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap } th { font: 700 11.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px }
.kpi { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px } .kpi b { display: block; font: 800 28px/1 var(--f-display) } .kpi small { color: var(--muted) }
.drop { display: grid; gap: 4px; border: 2px dashed var(--line); border-radius: 10px; padding: 14px; cursor: pointer; background: var(--panel2) }
.drop b { font: 800 17px var(--f-display); letter-spacing: .05em; text-transform: uppercase } .drop span { color: var(--muted); font-size: 13px } .drop.ok { border-color: var(--good) }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
select { font: inherit; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase }
.snapbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; gap: 10px; align-items: center; justify-content: center; background: rgba(11,16,22,.95); border-top: 2px solid var(--us); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.snapbar span { font: 800 20px var(--f-display); letter-spacing: .04em; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.snapbar .btn.pri { font-size: 20px; padding: 10px 28px }
.call.sel { border-color: var(--us); background: #2a0f16 }
body { padding-bottom: 90px }
.toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important }
.sitenav { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 6px; font: 600 13px var(--f-body) } .sitenav a { color: var(--muted); text-decoration: none } .sitenav a.cur { color: var(--ink) }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--night); padding: 8px 14px; border-radius: 8px; font-weight: 600; z-index: 30 }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto } }
</style>

<div class="wrap">
  <div class="top">
    <div><h1>Mock <span>Game</span></h1><nav class="sitenav" data-solnav="mock"></nav></div>
    <div class="row"><button class="btn" id="editBtn" type="button">Fix alignments</button><button class="btn" id="dataBtn" type="button">Data</button><button class="btn" id="endBtn" type="button">End &amp; report</button></div>
  </div>

  <section class="panel" id="setup" hidden>
    <h2>Game data <span>Hudl exports, .xlsx or .csv</span></h2>
    <div class="grid3">
      <label class="drop" id="dOurs" for="fOurs"><b>Our offense</b><span id="nOurs">Self-scout export. Builds the call sheet and every result.</span><input type="file" id="fOurs" accept=".xlsx,.csv" multiple hidden></label>
      <label class="drop" id="dThem" for="fThem"><b>Their games</b><span id="nThem">Their defense tagged (front, shell, blitz). Full games also give their offense's drives.</span><input type="file" id="fThem" accept=".xlsx,.csv" multiple hidden></label>
    </div>
    <div class="row" style="margin-top:10px"><label class="f">Opponent<input id="oppName" value="Liberty" style="font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px"></label><label class="f">Game length<select id="len"><option value="4">Full game</option><option value="2">One half</option></select></label><button class="btn pri" id="startBtn" type="button">Start new game</button></div>
    <div id="chk"></div>
  </section>

  <section class="panel" id="editor" hidden>
    <h2>Fix alignments <span>drag any player, then save. Saved spots are used every time that look comes up.</span></h2>
    <div class="chips" id="edMode"><button class="chip" type="button" data-m="def" aria-pressed="true">Their defense</button><button class="chip" type="button" data-m="off" aria-pressed="false">Our formations</button></div>
    <div class="row" id="edSel" style="margin-bottom:8px"></div>
    <div class="fieldbox"><canvas id="ed" width="1280" height="760" aria-label="Top-down field for dragging players into place"></canvas></div>
    <div class="row" style="margin-top:8px"><button class="btn pri" id="edSave" type="button">Save</button><button class="btn" id="edReset" type="button">Reset to standard</button><button class="btn" id="edClose" type="button">Back to the game</button><span class="note" id="edNote" style="margin:0"></span></div>
  </section>

  <div id="game">
    <div class="board" aria-live="polite" style="margin-bottom:12px">
      <div class="cell us"><small id="lUs">Melissa</small><b id="sUs">0</b></div>
      <div class="cell them"><small id="lThem">Liberty</small><b id="sThem">0</b></div>
      <div class="cell"><small id="sQ">Q1</small><b id="sClock">12:00</b></div>
      <div class="cell dd"><small>Down</small><b id="sDD">1st &amp; 10</b></div>
      <div class="cell"><small>Ball</small><b id="sBall">MEL 30</b></div>
    </div>
    <div class="fieldbox" style="margin-bottom:12px">
      <canvas id="fld" width="1280" height="760" aria-label="View from behind our offense"></canvas>
      <div class="tag" id="tag"></div>
      <div class="result" id="res" hidden></div>
    </div>
    <div class="cols">
      <section class="panel">
        <h2>Pre-snap read <span id="readSub"></span></h2>
        <div id="read"></div>
      </section>
      <section class="panel">
        <div id="act"></div>
        <h2>Call sheet <span id="callSub">our real results, this situation first</span></h2>
        <div class="chips" id="cf"><button class="chip" type="button" data-f="all" aria-pressed="true">All</button><button class="chip" type="button" data-f="run" aria-pressed="false">Run</button><button class="chip" type="button" data-f="pass" aria-pressed="false">Pass</button></div>
        <div class="calls" id="calls"></div>
      </section>
    </div>
    <section class="panel" style="margin-top:12px"><h2>Play by play</h2><ul class="log" id="log"></ul></section>
  </div>

  <section class="panel" id="report" hidden></section>
</div>
<div class="snapbar" id="snapbar" hidden><span id="snapName"></span><button class="btn" id="unsel" type="button">Change</button><button class="btn pri" id="snapBtn" type="button">Snap</button></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="scoutkit.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id) };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c] }) };
  var store = { get: function (k) { try { return JSON.parse(localStorage.getItem(k) || "null") } catch (e) { return null } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} } };
  function toast(t) { var e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { e.hidden = true }, 2600) }
  var rand = Math.random, pick = function (a) { return a[Math.floor(rand() * a.length)] };
  var titleCase = function (s) { return String(s || "").toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase() }) };

  // ======================= DATA =======================
  var D = { ours: null, them: null, opp: "Liberty", us: "Melissa" };
  function ballOf(yl) { if (yl == null || isNaN(yl)) return null; return yl < 0 ? -yl : yl > 0 ? 100 - yl : 50 }
  function dnb(dn, dist) { if (dn === 1) return "1st"; if (dn === 4) return "4th"; var l = dist <= 3 ? "short" : dist <= 6 ? "medium" : "long"; return (dn === 2 ? "2nd" : "3rd") + " & " + l }
  function zone(b) { return b < 20 ? "backed up" : b >= 80 ? "red zone" : "open field" }
  function shellOf(r) { var s = String(r.shell || "").toUpperCase(), c = String(r.cov || "").toUpperCase(); if (s === "MFO" || s === "MFC" || s === "0") return s; if (/^0|ZERO/.test(c)) return "0"; if (/^(2|4|6|QUARTER|TAMPA|SILVER|MATCH)/.test(c)) return "MFO"; if (/^(1|3|RED)/.test(c)) return "MFC"; return null }
  var SHELLN = { MFO: "2-high", MFC: "1-high", "0": "No deep safety" };
  function build() {
    var ours = D.ours ? D.ours.rows : [], th = D.them ? D.them.rows : [];
    // our calls: formation + concept
    var C = {};
    ours.forEach(function (r) {
      if (r.odk && r.odk !== "O") return; if (!r.type || r.pen || r.dn === 0) return;
      var concept = r.type === "Run" ? r.runC : r.passC; if (!r.form && !concept) return;
      var k = titleCase([r.form, concept].filter(Boolean).join(" "));
      (C[k] = C[k] || { name: k, form: titleCase(r.form || ""), concept: titleCase(concept || ""), plays: [] }).plays.push({ gain: r.gain == null ? 0 : r.gain, res: r.res || "", dn: r.dn, dist: r.dist, b: dnb(r.dn, r.dist), z: zone(ballOf(r.yl) || 50), sh: shellOf(r), run: r.type === "Run", td: r.td });
    });
    D.calls = Object.keys(C).map(function (k) { var c = C[k], n = c.plays.length, run = c.plays.filter(function (p) { return p.run }).length; c.run = run >= n / 2; c.n = n; c.avg = c.plays.reduce(function (t, p) { return t + p.gain }, 0) / n; c.eff = Math.round(100 * c.plays.filter(function (p) { return succ(p) }).length / n); c.scheme = /POWER|COUNTER|DART|TRAP/i.test(c.concept) ? "power" : "zone"; return c }).filter(function (c) { return c.n >= 4 }).sort(function (a, b) { return b.n - a.n });
    // their defense: real snaps by situation
    D.def = th.filter(function (r) { return r.odk === "D" && !r.pen && r.dn >= 1 }).map(function (r) { return { b: dnb(r.dn, r.dist), dn: r.dn, z: zone(ballOf(r.yl) == null ? 50 : 100 - ballOf(r.yl)), sh: shellOf(r), front: r.front ? titleCase(r.front) : null, blitz: r.blitz ? titleCase(r.blitz) : null, cov: r.cov ? titleCase(r.cov) : null } });
    // their offense: how their drives end
    // a drive = a run of their offensive snaps in a row (SERIES when tagged)
    var drv = {}, dn = 0, prevO = false, prevG = null; th.forEach(function (r) { var isO = r.odk === "O"; if (isO && (!prevO || r.gid !== prevG)) dn++; prevO = isO; prevG = r.gid; if (!isO) return; var k = r.ser != null ? r.gid + "|s" + r.ser : r.gid + "|d" + dn, d = drv[k] = drv[k] || { n: 0, td: false, to: false }; if (!r.pen) d.n++; if (r.td) d.td = true; if (/INTERCEPT|FUMBLE/.test(r.res || "")) d.to = true });
    var dl = Object.keys(drv).map(function (k) { return drv[k] }).filter(function (d) { return d.n >= 1 });
    D.theirRates = dl.length >= 12 ? { td: dl.filter(function (d) { return d.td }).length / dl.length, to: dl.filter(function (d) { return d.to && !d.td }).length / dl.length, fg: .06, plays: dl.reduce(function (t, d) { return t + d.n }, 0) / dl.length, n: dl.length, real: true } : { td: .3, to: .1, fg: .06, plays: 6, n: 0, real: false };
    D.fronts = top(D.def.map(function (r) { return r.front }), 6);
    D.forms = top(ours.filter(function (r) { return r.form }).map(function (r) { return titleCase(r.form) }), 12);
  }
  function succ(p) { var need = p.dn === 1 ? .4 : p.dn === 2 ? .5 : 1; return p.dist ? p.gain >= need * p.dist : p.gain >= 4 }
  function top(a, n) { var c = {}; a.forEach(function (x) { if (x) c[x] = (c[x] || 0) + 1 }); return Object.keys(c).sort(function (x, y) { return c[y] - c[x] }).slice(0, n).map(function (k) { return { k: k, n: c[k] } }) }
  // the snaps that fit this situation: narrow first, widen until there are enough
  function defPool(b, z, dn) {
    var tries = [[function (r) { return r.b === b && r.z === z }, b + ", " + z], [function (r) { return r.b === b }, b], [function (r) { return r.dn === dn }, ["", "1st", "2nd", "3rd", "4th"][dn] + " down"], [function () { return true }, "all downs"]];
    for (var i = 0; i < tries.length; i++) { var p = D.def.filter(tries[i][0]); if (p.length >= 8 || i === tries.length - 1) return { rows: p, label: tries[i][1] } }
  }

  // ======================= GAME =======================
  var G, look, call = null, anim = null, FILTER = "all";
  var QLEN = 12 * 60;
  function newGame() { SEL = null;
    var halves = +$("len").value || 4;
    G = { q: halves === 2 ? 1 : 1, qs: halves, clock: QLEN, us: 0, them: 0, ball: 30, dn: 1, dist: 10, hash: "M", poss: "us", snaps: [], drives: [], drive: null, over: false, kickoff2: false, fourth: false, wait: false };
    startDrive("Kickoff");
    $("log").innerHTML = ""; $("report").hidden = true; $("game").hidden = false;
    logDiv("Q1 · " + D.us + " ball at " + spot(G.ball));
    refresh();
  }
  function startDrive(how) { G.drive = { start: G.ball, how: how, plays: 0, yds: 0, q: G.q, clock: G.clock }; G.dn = 1; G.dist = Math.min(10, 100 - G.ball); G.fourth = false }
  function endDrive(res) { var d = G.drive; d.res = res; d.end = G.ball; G.drives.push(d); G.drive = null }
  function spot(b) { b = Math.round(b); return b === 50 ? "50" : b < 50 ? short(D.us) + " " + b : short(D.opp) + " " + (100 - b) }
  function short(n) { return String(n || "").slice(0, 3).toUpperCase() }
  function ord(n) { return ["", "1st", "2nd", "3rd", "4th"][n] }
  function clk(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2) }
  function qName() { return G.qs === 2 ? "H" + G.q : "Q" + G.q }
  function board() {
    $("lUs").textContent = D.us; $("lThem").textContent = D.opp; $("sUs").textContent = G.us; $("sThem").textContent = G.them;
    $("sQ").textContent = G.over ? "Final" : qName(); $("sClock").textContent = clk(G.clock);
    $("sDD").textContent = G.over ? "Final" : ord(G.dn) + " & " + (G.ball + G.dist >= 100 ? "Goal" : G.dist); $("sBall").textContent = spot(G.ball);
  }
  function situ() { return { b: dnb(G.dn, G.dist), z: zone(G.ball), dn: G.dn } }

  function readHTML() {
    var s = situ(), P = defPool(s.b, s.z, s.dn), R = P.rows, n = R.length;
    $("readSub").textContent = D.opp + " · " + P.label + " · " + n + " snaps";
    if (!n) return "<p class='note'>No defensive snaps loaded. Add their Hudl games under Data.</p>";
    var sh = top(R.map(function (r) { return r.sh }), 3), tagged = R.filter(function (r) { return r.sh }).length;
    var fr = top(R.map(function (r) { return r.front }), 3), fN = R.filter(function (r) { return r.front }).length;

    var sel = function (id, lab, opts, cur) { return "<label class='f'>" + lab + "<select id='" + id + "'>" + opts.map(function (o) { return "<option value='" + esc(o[0]) + "'" + (o[0] === cur ? " selected" : "") + ">" + esc(o[1]) + "</option>" }).join("") + "</select></label>" };
    var h = ED.mode === "def" ? sel("eFront", "Front", D.fronts.map(function (f) { return [f.k, f.k + " (" + f.n + ")"] }).concat([["", "Any front"]]), ED.front || "") + sel("eSh", "Shell", [["MFO", "2-high"], ["MFC", "1-high"], ["0", "No deep safety"]], ED.sh) + sel("eFt", "Against", [["2x2", "2x2"], ["trips", "Trips"], ["te", "Tight end"]], ED.ft)
      : sel("eForm", "Our formation", D.forms.map(function (f) { return [f.k, f.k + " (" + f.n + ")"] }), ED.form);
    $("edSel").innerHTML = h;
    ["eFront", "eSh", "eFt", "eForm"].forEach(function (id) { var e = $(id); if (e) e.onchange = function () { if (id === "eFront") ED.front = e.value || null; if (id === "eSh") ED.sh = e.value; if (id === "eFt") ED.ft = e.value; if (id === "eForm") ED.form = e.value; edLoad(); edDraw() } });
  }
  function edLoad() {
    if (ED.mode === "def") { ED.pts = defStd(ED.front, ED.sh, ED.ft); ED.ref = stdOff(ED.ft); var k = defKey(ED.front, ED.sh, ED.ft); $("edNote").textContent = ALIGN.def[k] ? "Using your saved spots for this look." : "Standard alignment. Drag to match " + D.opp + "." }
    else { ED.pts = offStd(ED.form); ED.ref = []; $("edNote").textContent = ALIGN.off[ED.form] ? "Using your saved spots for " + ED.form + "." : "Standard " + formType(ED.form) + " alignment. Drag to match how we line up." }
  }
  function edDraw() {
    ex.fillStyle = "#1d5631"; ex.fillRect(0, 0, EW, EH);
    for (var y = -15; y <= 25; y++) { var a = e2s({ x: -26.7, y: y }), b = e2s({ x: 26.7, y: y }); if (y % 5 === 0) seg(ex, a, b, "rgba(232,239,230,.6)", 2); [-HASH, HASH].forEach(function (hx) { seg(ex, e2s({ x: hx - .4, y: y }), e2s({ x: hx + .4, y: y }), "rgba(232,239,230,.6)", 2) }) }
    [-26.7, 26.7].forEach(function (x) { seg(ex, e2s({ x: x, y: -15 }), e2s({ x: x, y: 25 }), "rgba(232,239,230,.9)", 3) });
    seg(ex, e2s({ x: -26.7, y: 0 }), e2s({ x: 26.7, y: 0 }), "rgba(80,160,255,.9)", 3);
    ex.fillStyle = "rgba(232,239,230,.7)"; ex.font = "600 18px Barlow, sans-serif"; ex.textAlign = "left";
    for (var d = 5; d <= 20; d += 5) { var q = e2s({ x: -26, y: d }); ex.fillText(d + " yds", q.x + 6, q.y - 4) }
    if (ED.mode === "def") { ex.textAlign = "right"; ex.fillText("our strength →", EW - 16, 26) }
    var dot = function (p, lab, num, col, ghost) { var q = e2s(p), r = YS * .62; ex.globalAlpha = ghost ? .45 : 1; ex.fillStyle = col; ex.beginPath(); ex.arc(q.x, q.y, r, 0, Math.PI * 2); ex.fill(); ex.fillStyle = "#fff"; ex.font = "800 " + Math.round(r * .95) + "px Saira Condensed, sans-serif"; ex.textAlign = "center"; ex.textBaseline = "middle"; ex.fillText(lab, q.x, q.y + 1); ex.textBaseline = "alphabetic"; ex.globalAlpha = 1 };
    ED.ref.forEach(function (p, i) { dot(p, OFF_LAB[i], 0, "#d4213d", true) });
    ED.pts.forEach(function (p, i) { dot(p, ED.mode === "def" ? DEF_LAB[i] : OFF_LAB[i], 0, ED.mode === "def" ? "#2e5aa8" : "#d4213d", false) });
    var bq = e2s({ x: 0, y: -.2 }); ex.fillStyle = "#8a4b22"; ex.beginPath(); ex.ellipse(bq.x, bq.y, 9, 6, 0, 0, Math.PI * 2); ex.fill();
  }
  function evPt(e) { var r = ec.getBoundingClientRect(); return { x: (e.clientX - r.left) * EW / r.width, y: (e.clientY - r.top) * EH / r.height } }
  ec.addEventListener("pointerdown", function (e) { var p = evPt(e), best = -1, bd = 1e9; ED.pts.forEach(function (q, i) { var s = e2s(q), d = Math.hypot(s.x - p.x, s.y - p.y); if (d < bd) { bd = d; best = i } }); if (bd < YS * 1.4) { ED.drag = best; ec.setPointerCapture(e.pointerId); e.preventDefault() } });
  ec.addEventListener("pointermove", function (e) { if (ED.drag < 0) return; var p = evPt(e), q = s2e(p.x, p.y); q.x = Math.max(-26.5, Math.min(26.5, Math.round(q.x * 2) / 2)); q.y = Math.max(-12, Math.min(22, Math.round(q.y * 2) / 2)); ED.pts[ED.drag] = q; edDraw() });
  ec.addEventListener("pointerup", function () { ED.drag = -1 });
  ec.addEventListener("pointercancel", function () { ED.drag = -1 });
  document.querySelectorAll("#edMode .chip").forEach(function (b) { b.onclick = function () { ED.mode = b.dataset.m; edSel(); edLoad(); edDraw() } });
  $("edSave").onclick = function () { if (ED.mode === "def") ALIGN.def[defKey(ED.front, ED.sh, ED.ft)] = ED.pts; else ALIGN.off[ED.form] = ED.pts; store.set("sol-mock-align", ALIGN); edLoad(); edDraw(); toast("Saved. The mock game uses these spots now.") };
  $("edReset").onclick = function () { if (ED.mode === "def") delete ALIGN.def[defKey(ED.front, ED.sh, ED.ft)]; else delete ALIGN.off[ED.form]; store.set("sol-mock-align", ALIGN); edLoad(); edDraw(); toast("Back to the standard alignment.") };
  $("edClose").onclick = function () { $("editor").hidden = true; $("game").hidden = false; if (G && G.over) $("report").hidden = false; poses(); draw() };
  $("editBtn").onclick = edOpen;

  // ======================= FILES =======================
  var RAW = { ours: [], them: [] };
  function parseFile(f) {
    return f.arrayBuffer().then(function (buf) { return /\.csv$/i.test(f.name) ? csv(new TextDecoder().decode(buf)) : xlsx(buf) }).then(function (a) { var hi = 0; for (var i = 0; i < Math.min(10, a.length); i++) { if ((a[i] || []).some(function (h) { return /ODK|^DN$|RESULT|PLAY ?#/i.test(String(h || "")) })) { hi = i; break } } return { name: f.name, header: a[hi] || [], rows: a.slice(hi + 1).filter(function (r) { return r && r.some(function (v) { return v != null && v !== "" }) }) } });
  }
  function csv(t) { var rows = [], row = [], cur = "", q = false; for (var i = 0; i < t.length; i++) { var ch = t[i]; if (q) { if (ch === '"' && t[i + 1] === '"') { cur += '"'; i++ } else if (ch === '"') q = false; else cur += ch } else if (ch === '"') q = true; else if (ch === ",") { row.push(cur); cur = "" } else if (ch === "\n" || ch === "\r") { if (ch === "\r" && t[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = "" } else cur += ch } if (cur || row.length) { row.push(cur); rows.push(row) } return rows.map(function (r) { return r.map(function (v) { return v !== "" && !isNaN(v) ? +v : v }) }) }
  function xlsx(buf) { if (!window.XLSX) return Promise.reject(new Error("xlsx")); var wb = XLSX.read(buf, { type: "array" }); return Promise.resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" })) }
  function loadData() {
    D.ours = RAW.ours.length ? SK.load(RAW.ours, {}) : null; D.them = RAW.them.length ? SK.load(RAW.them, {}) : null; build();
    var c1 = D.ours ? SK.check(D.ours, { want: "O" }) : null, c2 = D.them ? SK.check(D.them, { want: "D" }) : null;
    $("chk").innerHTML = (c1 && c1.lvl !== "ok" ? SK.checkHTML(c1, "Our offense") : "") + (c2 && c2.lvl !== "ok" ? SK.checkHTML(c2, "Their games") : "");
    $("nOurs").textContent = D.ours ? RAW.ours.map(function (f) { return f.name }).join(", ") + " · " + D.calls.length + " calls with 4+ plays" : "Self-scout export. Builds the call sheet and every result.";
    $("nThem").textContent = D.them ? RAW.them.map(function (f) { return f.name }).join(", ") + " · " + D.def.length + " defensive snaps" + (D.theirRates.real ? " · " + D.theirRates.n + " of their drives" : "") : "Their defense tagged (front, shell, blitz). Full games also give their offense's drives.";
    $("dOurs").classList.toggle("ok", !!D.ours); $("dThem").classList.toggle("ok", !!D.them);
  }
  function addFiles(kind, files) { Promise.all(Array.prototype.map.call(files, parseFile)).then(function (L) { RAW[kind] = RAW[kind].concat(L); loadData(); toast("Loaded " + L.length + " file" + (L.length === 1 ? "" : "s")) }, function () { toast("Couldn't read that file. Export it from Hudl as Excel (.xlsx) or CSV.") }) }
  $("fOurs").onchange = function () { if (this.files.length) addFiles("ours", this.files); this.value = "" };
  $("fThem").onchange = function () { if (this.files.length) addFiles("them", this.files); this.value = "" };
  $("dataBtn").onclick = function () { var s = $("setup"); s.hidden = !s.hidden; if (!s.hidden) s.scrollIntoView({ behavior: "smooth" }) };
  $("startBtn").onclick = function () { if (!D.calls || !D.calls.length) { toast("Add our offense's Hudl export first."); return } D.opp = $("oppName").value.trim() || "Opponent"; $("setup").hidden = true; newGame(); camBall = G.ball; refresh() };
  $("endBtn").onclick = function () { if (!G || !G.snaps.length) { toast("Run a few plays first."); return } G.over = true; if (G.drive) endDrive("Stopped"); refresh(); finishGame() };
  document.querySelectorAll("#cf .chip").forEach(function (b) { b.onclick = function () { FILTER = b.dataset.f; document.querySelectorAll("#cf .chip").forEach(function (x) { x.setAttribute("aria-pressed", x === b) }); refresh() } });
  window.addEventListener("resize", function () { size(); if (!$("editor").hidden) { eSize(); edDraw() } draw() });

  // ======================= START =======================
  size();
  if (window.MOCK_DATA) { RAW.ours = MOCK_DATA.ours || []; RAW.them = MOCK_DATA.them || []; D.us = MOCK_DATA.us || D.us; D.opp = MOCK_DATA.opp || D.opp; $("oppName").value = D.opp; loadData(); newGame(); camBall = G.ball; refresh() }
  else { $("setup").hidden = false; G = null }
  document.fonts && document.fonts.ready.then(function () { draw() });
})();
</script>
