// light / dark switch shared by every page; first visit follows the device, then remembers the choice
(function () {
  var K = "solutions-theme", root = document.documentElement, get = function () { try { return localStorage.getItem(K) } catch (e) { return null } };

  function apply() { var t = cur(); root.setAttribute("data-theme", t); root.style.colorScheme = t; var b = document.getElementById("solTheme"); if (b) { b.textContent = t === "dark" ? "☀︎ Light" : "☾ Dark"; b.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode") } }
  apply();
  window.solThemeNow = cur;
  // paper is always light
  window.addEventListener("beforeprint", function () { root.setAttribute("data-theme", "light"); root.style.colorScheme = "light" });
  window.addEventListener("afterprint", apply);

    b.addEventListener("click", function () { var n = cur() === "dark" ? "light" : "dark"; try { localStorage.setItem(K, n) } catch (e) {} apply(); try { window.dispatchEvent(new Event("solthemechange")) } catch (e) {} });

</head><body><title>Solutions Scout Reports</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Scout reports: print-ready self scout, opponent scout and game management card. */
:root {
  --bg: #f3f2f0; --panel: #ffffff; --ink: #16171b; --muted: #62656d; --line: #dcdad6;
  --red: #e0302a; --hot: #fff1c7; --hotink: #6b4a00; --bar: #0d0e12; --barink: #f4f4f5;
  --chip: #ecebe8; --chipon: #16171b; --chiponink: #fff; --blue: #2563eb; --school: #e0302a;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif; --f-body: "Barlow", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121316; --panel: #1b1d21; --ink: #ecedef; --muted: #a2a5ad; --line: #2e3137; --hot: #4a3a10; --hotink: #ffe08a; --chip: #2a2d33; --chipon: #ecedef; --chiponink: #121316; color-scheme: dark } }
:root[data-theme="dark"] { --red-txt: color-mix(in srgb, var(--red) 60%, #fff); --school-txt: color-mix(in srgb, var(--school) 60%, #fff); --bg: #121316; --panel: #1b1d21; --ink: #ecedef; --muted: #a2a5ad; --line: #2e3137; --hot: #4a3a10; --hotink: #ffe08a; --chip: #2a2d33; --chipon: #ecedef; --chiponink: #121316; color-scheme: dark }
* { box-sizing: border-box } [hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar) }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--barink); border-bottom: 3px solid var(--school); padding-block: 10px }
.hrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; max-width: 1400px; margin: 0 auto }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .03em; text-transform: uppercase }
.brand .school { color: color-mix(in srgb, var(--school) 60%, #fff) }
.opp { color: #b9bbc0; font-size: 13px }
.side { display: inline-flex; border: 1px solid #33363d; border-radius: 9px; overflow: hidden }
.side a, .side span { font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .08em; padding: 7px 14px; color: #9a9ca3; text-decoration: none }
.side span { background: var(--school); color: #fff }
.sb { display: flex; flex-direction: column; align-items: center; min-width: 88px; padding: 3px 12px 4px; border-radius: 8px; border: 1px solid #2c2f36; background: #050506 }
.sb .tm { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #b9bbc0; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.sb.us .pts { color: #ff4d45 }
.board { display: flex; gap: 8px }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center }
.pill { font-family: var(--f-display); font-weight: 700; font-size: 20px; padding: 4px 10px; border-radius: 7px; background: #22252b; color: #f4f4f5; border: 0 }
.pill.dd { background: var(--school) } .pill.on { color: #4ade80 } .pill.off { color: #fbbf24 } .pill.err { color: #f87171 }
.tabs { display: flex; gap: 6px; max-width: 1400px; margin: 8px auto 0; flex-wrap: wrap }
.tabs button, .tabs a { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border-radius: 7px; border: 0; background: transparent; color: #b9bbc0; cursor: pointer; text-decoration: none }
.tabs [aria-selected="true"] { background: #fff; color: #0d0e12 }

main { max-width: 1400px; margin: 0 auto; padding-block: 14px }
.grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 14px; align-items: start }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0 }

.lab { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 4px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .03em; padding: 8px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; min-height: 42px }
.chip[aria-pressed="true"] { background: var(--chipon); color: var(--chiponink); border-color: var(--chipon) }
.chip.run[aria-pressed="true"] { background: #b42318; border-color: #b42318; color: #fff }
.chip.pass[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff }
.chip.same { background: #6d28d9; border-color: #6d28d9; color: #fff; width: 100%; text-align: left; font-size: 19px }
.chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--school); outline-offset: 2px }
.btn { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer }
.btn.pri { background: var(--school); border-color: var(--school); color: var(--on-school, #fff) }
.field { display: block; width: 100%; height: auto; border-radius: 10px; touch-action: none; user-select: none; -webkit-user-select: none }
.spotrow { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap }
.spotout { flex: 1 1 200px; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 23px }
.step { border-left: 4px solid transparent; padding-left: 10px; margin-left: -14px }
.step.now { border-left-color: var(--school) }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px } @media (max-width: 560px) { .row2 { grid-template-columns: 1fr } }
.gaps { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px }
.gaps .chip { padding: 8px 0; text-align: center; font-size: 15px; min-width: 0 }
.ol { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; margin-top: 3px; font-size: 11px; color: var(--muted); text-align: center; font-weight: 700 }
.tbl { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums }
th { background: var(--bar); color: var(--barink); font-family: var(--f-display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12.5px; text-align: left; padding: 6px 8px; white-space: nowrap; border-bottom: 2px solid var(--school) }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td:first-child { font-weight: 700 } td.hot { background: var(--hot); color: var(--hotink); font-weight: 700 } tr.small td { color: var(--muted) }
.dc { background: var(--bar); color: var(--barink); border-radius: 10px; padding: 14px 16px; border-left: 5px solid var(--school) }
.dc h3 { margin: 0 0 8px; font-family: var(--f-display); font-size: 20px; letter-spacing: .03em }
.dc ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px }
.dc li { display: grid; grid-template-columns: 22px 1fr; gap: 8px }
.dc li b { color: #ff4d45; font-family: var(--f-display); font-size: 20px }
.dc .k { display: block; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #9a9ca3; font-weight: 700 }
.bars { display: flex; flex-direction: column; gap: 6px }
.bar { display: grid; grid-template-columns: 100px 1fr 92px; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 600 }
.track { height: 16px; border-radius: 4px; background: var(--chip); overflow: hidden } .track i { display: block; height: 100% }
.note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0 }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--chip); margin-right: 3px }
.tag.good { background: #dcfce7; color: #166534 } .tag.bad { background: #fee2e2; color: #991b1b }
textarea { font: inherit; width: 100%; min-height: 60px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink) }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; margin-bottom: 10px }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bar); color: var(--barink); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 20; max-width: 90vw }
</style>

<style>
.seg { display: flex; gap: 6px; flex-wrap: wrap }
.seg button { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--chipon); color: var(--chiponink); border-color: var(--chipon) }

.stack { display: flex; flex-direction: column; gap: 12px }
tr.tot td { font-weight: 800; background: var(--chip) }
tr.pick td { background: var(--hot); color: var(--hotink) }
.wl { font-weight: 800 } .wl.w { color: #16a34a } .wl.l { color: #dc2626 }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px }
.kpi { background: var(--bar); color: var(--barink); border-radius: 10px; padding: 10px 12px; border-left: 4px solid var(--school) }
.kpi b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1.1 } .kpi span { font-size: 12px; color: #b9bbc0; letter-spacing: .06em; text-transform: uppercase; font-weight: 700 }
.empty { padding: 30px 10px; text-align: center; color: var(--muted) }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px } @media (max-width: 1300px) { .grid3 { grid-template-columns: minmax(0, 1fr) } }

@media print { header .tabs, .noprint { display: none !important } .panel { break-inside: avoid } }
</style>

<style>
.rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px } @media (max-width: 900px) { .rgrid { grid-template-columns: 1fr } }
.rcard { border: 2px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); cursor: pointer; text-align: left; font: inherit; color: var(--ink) } .rcard[aria-pressed=true] { border-color: var(--school) } .rcard b { display: block; font-family: var(--f-display); font-size: 20px; letter-spacing: .03em; text-transform: uppercase } .rcard span { font-size: 13.5px; color: var(--muted) }
.drop2 { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 14px; cursor: pointer; text-align: center } .drop2 b { display: block } .drop2 .note { margin: 4px 0 0 }
.files { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px } @media (max-width: 900px) { .files { grid-template-columns: 1fr } }
.flist { font-size: 13px; color: var(--muted); margin-top: 6px } .flist button { font: inherit; font-size: 12px; border: 0; background: none; color: var(--school); cursor: pointer; text-decoration: underline }
.glist { display: flex; flex-direction: column; gap: 6px; margin-top: 8px } .grow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap } .grow input[type=text] { font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 180px } .grow small { color: var(--muted) }
.opts { display: flex; gap: 12px; flex-wrap: wrap; align-items: end } .opts label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) } .opts input, .opts select { font: inherit; font-size: 15px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-transform: none; letter-spacing: 0 }
#pages { display: flex; flex-direction: column; align-items: safe center; gap: 16px; padding: 16px 0; background: #6b6f76; border-radius: 12px; overflow-x: auto } #pages .skpage { box-shadow: 0 6px 24px rgba(0,0,0,.35); flex: 0 0 auto }
.srcseg { display: inline-flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--chip, #e9e7e3) } .srcseg button { font: 700 14px Barlow, sans-serif; padding: 6px 12px; border-radius: 8px; border: 0; background: none; color: var(--ink); cursor: pointer } .srcseg button[aria-pressed=true] { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.15) }
@media print { @page { size: letter; margin: 0 } html, body { background: #fff !important } body > *:not(main) { display: none !important } main > .stack > *:not(#pagesWrap) { display: none !important } main, .stack, #pagesWrap, #pages { padding: 0 !important; margin: 0 !important; background: #fff !important; gap: 0 !important; display: block !important; border-radius: 0 !important } #pagesWrap > :not(#pages) { display: none !important } #pages .skpage { box-shadow: none !important; zoom: 1 !important } }
</style>
